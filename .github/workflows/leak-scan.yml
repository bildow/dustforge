# Red team item 5: on every push and pull request, is any of the owner's DemiPass vault values in this repository?
# The server does the matching (bin/leak-scan.js never receives a value). A hit fails the run, is a critical event,
# mails the owner and revokes the scan token (stop the line: fix the leak, then have a new token approved and set as
# the DEMIPASS_SCAN_TOKEN secret).
name: leak-scan
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan for DemiPass vault values
        env:
          DEMIPASS_SCAN_TOKEN: ${{ secrets.DEMIPASS_SCAN_TOKEN }}
        run: |
          if [ -z "$DEMIPASS_SCAN_TOKEN" ]; then echo "::error::the DEMIPASS_SCAN_TOKEN secret is not set (red team item 5)"; exit 1; fi
          node bin/leak-scan.js .
